      t2:{p:"A empresa comete falta grave? Por exemplo: atrasa salário, não deposita o FGTS, humilha, exige função fora do combinado.", ops:[["Sim","fRI"],["Não","t4"]]},
      t4:{p:"Ele trabalha sem carteira assinada ou como PJ, com CNPJ ou MEI?", ops:[["Sim","fVinc"],["Não, tem carteira","fOutro"]]},
      t3:{p:"Na data da dispensa havia alguma destas situações: gravidez, volta de afastamento por acidente de trabalho, mandato na CIPA ou no sindicato, ou doença grave que gera preconceito?", ops:[["Sim","fReint"],["Não","t5"]]},
      t5:{p:"Ele trabalhava sem carteira assinada ou como PJ?", ops:[["Sim","fVincSaiu"],["Não, tinha carteira","fVerbas"]]}
    },
    fins:{
      fRI:{t:"Rescisão indireta", x:"A falta grave do empregador permite ao empregado romper o contrato e receber tudo como se tivesse sido dispensado sem justa causa.",
        i:["Liste cada falta com data e prova: extrato do FGTS, comprovantes de salário atrasado, mensagens.","Na falta de descumprir o contrato (alínea d), ele pode continuar trabalhando enquanto o processo corre (art. 483, § 3º).","Oriente a não pedir demissão nem abandonar o emprego: os dois fazem perder direitos.","Verbas: saldo de salário, aviso prévio, 13º e férias proporcionais com 1/3, FGTS com multa de 40% e guias do seguro-desemprego."], b:"CLT, art. 483"},
      fVinc:{t:"Reconhecimento de vínculo, e talvez pejotização", x:"Se há pessoalidade, habitualidade, salário e ordens, existe vínculo de emprego, com ou sem carteira, com ou sem CNPJ.",
        i:["Pergunte quem dava as ordens, qual era o horário, se podia mandar outra pessoa no lugar e como recebia.","CNPJ ou MEI aberto a pedido da empresa, ou PJ de quem foi empregado dela nos últimos 18 meses, é forte indício de pejotização.","Junte mensagens, crachá, e-mail da empresa, escalas e testemunhas.","A pejotização está em discussão no STF (Tema 1.389). Confira o andamento antes de ajuizar."], b:"CLT, arts. 2º, 3º e 9º"},
      fOutro:{t:"Fora dos temas do jogo", x:"Com carteira assinada e sem falta grave, o caso pode envolver outros direitos do contrato, como horas extras, adicionais ou desvio de função. Vale uma conversa mais longa.",
        i:["Peça os holerites e os cartões de ponto para ver horas extras e adicionais."], b:"CLT"},
      fReint:{t:"Reintegração ou indenização da estabilidade", x:"A dispensa durante a estabilidade é nula: o empregado volta ao emprego ou, se o período já passou, recebe os salários do período.",
        i:["Gestante: da confirmação da gravidez até 5 meses após o parto, e o desconhecimento da empresa não importa (Súmula 244 do TST).","Acidente de trabalho: 12 meses depois do fim do auxílio-doença acidentário (Lei 8.213/91, art. 118).","CIPA e dirigente sindical: do registro da candidatura até 1 ano depois do fim do mandato.","Doença grave que gera preconceito: a dispensa é presumida discriminatória (Súmula 443 do TST).","Se ainda estiver no período, peça a reintegração com tutela de urgência."], b:"ADCT, art. 10; Súmulas 244, 378, 396 e 443 do TST"},
      fVincSaiu:{t:"Vínculo depois da saída: atenção ao prazo", x:"Ele pode pedir o reconhecimento do vínculo e as verbas, mas a ação tem de entrar em até 2 anos depois da saída, e só alcança os últimos 5 anos.",
        i:["Anote a data exata da saída e calcule o prazo de 2 anos.","Cada mês de espera faz perder um mês dos 5 anos cobráveis.","Reúna provas do trabalho: mensagens, fotos, comprovantes de pagamento, testemunhas.","O pedido de anotação para prova junto à Previdência não prescreve (CLT, art. 11, § 1º)."], b:"CF, art. 7º, XXIX"},
      fVerbas:{t:"Confira as verbas da rescisão", x:"Com carteira e sem estabilidade, confira se a rescisão foi paga certa e dentro do prazo.",
        i:["Saldo de salário, aviso prévio, 13º e férias proporcionais com 1/3, FGTS com multa de 40%.","Pagamento depois de 10 dias do fim do contrato gera multa de um salário (CLT, art. 477, §§ 6º e 8º).","Prazo para a ação: 2 anos depois da saída."], b:"CLT, art. 477"}
    }},
  { id:"perguntas", nome:"Perguntas ao cliente", tipo:"perguntas", itens:[
    {p:"Quando você começou e quando saiu, ou ainda está lá?", x:"Define o prazo: a ação entra em até 2 anos da saída e cobra os últimos 5 anos."},
    {p:"Tinha carteira assinada? Desde o primeiro dia?", x:"Período sem registro é pedido de vínculo, com todos os reflexos."},
    {p:"Quem dava as ordens? Tinha horário? Podia mandar outra pessoa no seu lugar?", x:"Mostra a subordinação e a pessoalidade, dois requisitos do vínculo."},
    {p:"Como recebia: holerite, Pix, nota fiscal? Valor fixo todo mês?", x:"Mostra a onerosidade e ajuda a ver a pejotização."},
    {p:"Você abriu CNPJ ou MEI a pedido da empresa? Já tinha sido empregado dela?", x:"PJ aberto a pedido, ou ex-empregado nos últimos 18 meses, indica pejotização (Lei 6.019/74, art. 5º-C)."},
    {p:"O FGTS está sendo depositado? Já conferiu no aplicativo do FGTS?", x:"FGTS sem depósito autoriza a rescisão indireta."},
    {p:"O salário atrasa? Com que frequência?", x:"Atraso de salário é descumprimento do contrato (art. 483, d)."},
    {p:"Na dispensa você estava grávida, afastado pelo INSS, era da CIPA ou do sindicato, ou tinha doença grave?", x:"São as estabilidades que levam à reintegração ou à indenização do período."},
    {p:"Recebeu as verbas da rescisão? Quantos dias depois da saída?", x:"Pagamento depois de 10 dias gera a multa do art. 477, § 8º."},
    {p:"Tem testemunhas? Mensagens, áudios, e-mails ou fotos do ponto?", x:"Vínculo e falta grave se provam com testemunha e documento."}
  ]},
  { id:"essencial", nome:"O essencial", tipo:"cards", itens:[
    {t:"Requisitos do vínculo", x:"Pessoa física, pessoalidade, não eventualidade, onerosidade e subordinação. Presentes todos, há emprego, com ou sem carteira.", b:"CLT, arts. 2º e 3º"},
    {t:"Primazia da realidade", x:"Vale o que acontece na prática, não o que está no papel. É nulo o ato feito para fraudar a CLT.", b:"CLT, art. 9º"},
    {t:"Rescisão indireta", x:"A justa causa do empregador: serviço além das forças, rigor excessivo, perigo, descumprir o contrato, ofensa à honra, agressão ou redução do trabalho que reduz o salário.", b:"CLT, art. 483"},
    {t:"Estabilidades", x:"Gestante (até 5 meses após o parto), acidentado (12 meses após o benefício), CIPA e dirigente sindical (até 1 ano após o mandato).", b:"ADCT, art. 10; Lei 8.213/91, art. 118; CF, art. 8º, VIII"},
    {t:"Prescrição", x:"2 anos depois da saída para entrar com a ação, alcançando os 5 anos anteriores ao ajuizamento.", b:"CF, art. 7º, XXIX"},
    {t:"Pejotização", x:"CNPJ usado para esconder emprego. A quarentena de 18 meses impede contratar como PJ o ex-empregado. O tema está no STF (Tema 1.389).", b:"CLT, art. 9º; Lei 6.019/74, art. 5º-C"}
  ]},
  { id:"documentos", nome:"Documentos", tipo:"lista", itens:[
    "Carteira de trabalho (inclusive a digital)","Holerites ou comprovantes de pagamento","Extrato do FGTS","Termo de rescisão (TRCT), se houver","Cartões de ponto ou escalas","Mensagens, áudios e e-mails do trabalho","Contrato de prestação de serviços e notas fiscais, se era PJ","Exames e atestados (gravidez, doença, acidente)","Nome e contato das testemunhas"
  ]}
  ]},
{ id:"previdenciario", titulo:"Direito Previdenciário", tema:"previdenciario", cor:"--c-previdenciario", resumo:"Descubra o benefício: maternidade, BPC, auxílio-doença ou pino e placa",
  secoes:[
  { id:"triagem", nome:"Qual benefício?", tipo:"triagem", inicio:"p1",
    nos:{
      p1:{p:"O caso envolve gravidez, parto, adoção ou guarda para adoção?", ops:[["Sim","fSM"],["Não","p2"]]},
      p2:{p:"Hoje o cliente está sem conseguir trabalhar por causa de doença ou acidente?", ops:[["Sim","p3"],["Não","p4"]]},
      p3:{p:"Existe chance de melhorar ou de voltar a trabalhar, mesmo em outra função?", ops:[["Sim, há chance","fAD"],["Não, é para sempre","fAI"]]},
      p4:{p:"Ele sofreu um acidente, de qualquer tipo, já voltou a trabalhar e ficou com sequela, como pino, placa, perda de força ou de movimento?", ops:[["Sim","p5"],["Não","p6"]]},
      p5:{p:"Na data do acidente ele era empregado (de carteira ou doméstico), trabalhador avulso ou rural em economia familiar?", ops:[["Sim","fAA"],["Não, era autônomo, MEI ou facultativo","fAAnao"]]},
      p6:{p:"Ele tem 65 anos ou mais, ou uma deficiência de longo prazo (2 anos ou mais)?", ops:[["Sim","p7"],["Não","fOutroPrev"]]},
      p7:{p:"A renda da família, dividida por pessoa, é baixa: até 1/4 do salário mínimo, ou pouco acima com gastos altos de saúde?", ops:[["Sim","fBPC"],["Não","fBPCnao"]]}
    },
    fins:{
      fSM:{t:"Salário-maternidade", x:"120 dias de benefício, a partir de até 28 dias antes do parto. Vale também para adoção e guarda para adoção, inclusive para o homem segurado.",
        i:["Confirme a qualidade de segurada na data do parto: empregada, desempregada no período de graça, autônoma, MEI, facultativa ou rural.","Desde as ADIs 2110 e 2111 do STF não se exige carência. Da contribuinte individual, o INSS pede a prova da atividade e ao menos uma contribuição.","Empregada de carteira: em regra a empresa paga e compensa com o INSS. Desempregada, autônoma e MEI pedem direto no Meu INSS.","Peça a certidão de nascimento ou o termo de guarda."], b:"Lei 8.213/91, arts. 71 a 73"},
      fAD:{t:"Auxílio por incapacidade temporária (auxílio-doença)", x:"Para quem está incapaz para o trabalho habitual por mais de 15 dias, com chance de recuperação.",
        i:["Carência de 12 contribuições, dispensada em acidente de qualquer natureza, doença do trabalho e doenças graves da lista legal.","Confira a qualidade de segurado na data em que a incapacidade começou.","Doença anterior à filiação só dá direito se a incapacidade veio do agravamento.","Empregado: a empresa paga os 15 primeiros dias.","Se a doença tem relação com o trabalho, o benefício pode ser acidentário, com 12 meses de estabilidade na volta."], b:"Lei 8.213/91, arts. 59 a 63"},
      fAI:{t:"Aposentadoria por incapacidade permanente", x:"Quando a incapacidade é total e sem chance de reabilitação para outra atividade. Não está nas cartas do jogo, mas é o passo seguinte da conversa.",
        i:["Os requisitos de carência e qualidade de segurado são os mesmos do auxílio-doença.","Na Justiça, a análise considera também as condições pessoais, como idade e escolaridade (Súmula 47 da TNU).","Laudos que digam que não há reabilitação possível ajudam muito."], b:"Lei 8.213/91, art. 42"},
      fAA:{t:"Auxílio-acidente (pino e placa)", x:"Indenização mensal de 50% do salário de benefício para quem ficou com sequela que reduz a capacidade para o trabalho habitual. É recebida junto com o salário.",
        i:["Não exige carência e cobre acidente de qualquer natureza, inclusive fora do trabalho.","O pino e a placa, sozinhos, não bastam: a perícia precisa ver a redução da capacidade para o trabalho que ele fazia.","Começa no dia seguinte ao fim do auxílio-doença, se ele recebeu.","Acaba com a aposentadoria, porque não se acumula com ela.","Acidente do trabalho: ação na Justiça Estadual. Acidente fora do trabalho: Justiça Federal."], b:"Lei 8.213/91, art. 86"},
      fAAnao:{t:"Sem direito ao auxílio-acidente", x:"Contribuinte individual (autônomo que paga carnê, MEI) e segurado facultativo não têm direito ao auxílio-acidente.",
        i:["Confira se, na data do acidente, ele tinha algum vínculo como empregado: aí o direito existe.","Se ainda há incapacidade, avalie o auxílio-doença."], b:"Lei 8.213/91, art. 18, § 1º"},
      fBPC:{t:"BPC/LOAS", x:"1 salário mínimo por mês para a pessoa idosa (65+) ou com deficiência de longo prazo, de família de baixa renda. Não exige contribuição.",
        i:["A inscrição no CadÚnico, atualizada, é requisito.","Liste quem mora na casa e a renda de cada um. Gastos com remédio e tratamento ajudam a provar a necessidade.","A pessoa com deficiência passa por avaliação médica e social do INSS.","Não paga 13º e não deixa pensão por morte. Se ele contribuiu ao INSS, veja antes se tem direito a aposentadoria.","A ação contra o INSS vai para a Justiça Federal (JEF)."], b:"Lei 8.742/93, art. 20"},
      fBPCnao:{t:"Renda acima do critério", x:"Com renda familiar alta, o BPC tende a ser negado. Mas a renda pode ser recalculada.",
        i:["Benefício de até 1 salário mínimo de outro idoso ou pessoa com deficiência da família não entra no cálculo (Lei 8.742/93, art. 20, § 14).","Gastos com saúde e cuidados podem ser usados para provar a necessidade.","Confirme quem realmente mora na casa: só entra no cálculo a família que vive sob o mesmo teto."], b:"Lei 8.742/93, art. 20, §§ 1º e 14"},
      fOutroPrev:{t:"Outros benefícios", x:"Sem incapacidade, sem sequela, sem gravidez e sem idade ou deficiência, o caso pode ser de aposentadoria, pensão por morte ou revisão. Esses temas não estão no jogo.",
        i:["Peça o extrato do CNIS no Meu INSS para ver todo o histórico de contribuições."], b:"Lei 8.213/91"}
    }},
  { id:"perguntas", nome:"Perguntas ao cliente", tipo:"perguntas", itens:[
    {p:"Você contribui ou já contribuiu para o INSS? Como: carteira, carnê ou MEI?", x:"A forma de contribuir define a categoria, e a categoria define os benefícios. Autônomo, por exemplo, não tem auxílio-acidente."},
    {p:"Quando foi a sua última contribuição?", x:"Mostra se ainda há qualidade de segurado. O período de graça vai de 6 a 36 meses, conforme o caso."},
    {p:"Já pediu o benefício no INSS? Tem o protocolo e a carta de indeferimento?", x:"Sem pedido prévio, a ação de benefício novo pode ser extinta (STF, Tema 350)."},
    {p:"Quando a doença começou? E quando ela passou a impedir o trabalho?", x:"Doença anterior à filiação só dá direito se houve agravamento. A data de início da incapacidade decide o caso."},
    {p:"Qual é o seu trabalho no dia a dia?", x:"A incapacidade e a sequela são medidas em relação à atividade habitual."},
    {p:"O acidente foi no trabalho, no caminho do trabalho ou fora dele?", x:"Acidente do trabalho, inclusive o de trajeto, gera benefício acidentário, 12 meses de estabilidade e ação na Justiça Estadual. Fora do trabalho, Justiça Federal."},
    {p:"Quantas pessoas moram com você e quanto cada uma ganha?", x:"É a conta da renda por pessoa do BPC."},
    {p:"Você está no CadÚnico? Quando atualizou?", x:"A inscrição atualizada é requisito do BPC."},
    {p:"Tem laudos, exames e atestados com CID e data?", x:"São a base da perícia. Quanto mais antigos e detalhados, melhor para provar a data de início."},
    {p:"Qual a data do parto ou da adoção, e qual era a sua situação de trabalho na época?", x:"Define a qualidade de segurada e quem paga o salário-maternidade."}
  ]},
  { id:"essencial", nome:"O essencial", tipo:"cards", itens:[
    {t:"Qualidade de segurado", x:"Quem contribui é segurado. Ao parar, mantém a qualidade no período de graça: 12 meses em regra, até 36 em certos casos, e 6 para o facultativo.", b:"Lei 8.213/91, art. 15"},
    {t:"Carência", x:"Número mínimo de contribuições. 12 para o auxílio-doença; nenhuma para o auxílio-acidente e, desde o STF, para o salário-maternidade.", b:"Lei 8.213/91, arts. 25 e 26"},
    {t:"Salário-maternidade", x:"120 dias, a partir de até 28 dias antes do parto. Também na adoção.", b:"Lei 8.213/91, arts. 71 e 71-A"},
    {t:"BPC/LOAS", x:"1 salário mínimo para pessoa idosa (65+) ou com deficiência de família de baixa renda. Sem 13º e sem pensão.", b:"Lei 8.742/93, art. 20"},
    {t:"Auxílio-doença", x:"Incapacidade para o trabalho habitual por mais de 15 dias. Empregado recebe os 15 primeiros dias da empresa.", b:"Lei 8.213/91, arts. 59 e 60"},
    {t:"Auxílio-acidente", x:"50% do salário de benefício por sequela que reduz a capacidade. Sem carência, recebido junto com o salário.", b:"Lei 8.213/91, art. 86"},
    {t:"Pedido prévio", x:"Benefício novo exige pedido ao INSS antes da ação, mas não o esgotamento dos recursos.", b:"STF, RE 631.240 (Tema 350)"}
  ]},
  { id:"documentos", nome:"Documentos", tipo:"lista", itens:[
    "RG e CPF","Extrato do CNIS (no Meu INSS)","Carteira de trabalho","Carnês e guias pagas","Laudos, exames, receitas e atestados com CID","CAT (Comunicação de Acidente de Trabalho), se houver","Carta de indeferimento do INSS","Comprovante do CadÚnico","Comprovante de residência e de renda de quem mora na casa","Certidão de nascimento ou termo de guarda"
  ]}
  ]},
{ id:"federal", titulo:"Vara Federal e JEF", tema:"previdenciario", cor:"--c-federal", resumo:"Onde entra a ação contra o INSS e como ela anda",
  secoes:[
  { id:"essencial", nome:"O essencial", tipo:"cards", itens:[
    {t:"O que vai para a Justiça Federal", x:"As causas em que a União, uma autarquia federal (como o INSS) ou uma empresa pública federal (como a Caixa) é parte. No Rio, a Seção Judiciária do Rio de Janeiro, ligada ao TRF da 2ª Região.", b:"CF, art. 109, I"},
    {t:"A exceção do acidente do trabalho", x:"Benefício por acidente do trabalho vai para a Justiça Estadual, mesmo sendo contra o INSS.", b:"CF, art. 109, I; Súmula 15 do STJ"},
    {t:"Sem vara federal na cidade", x:"Se o segurado mora em comarca a mais de 70 km de uma cidade com vara federal, pode entrar na Justiça Estadual da comarca dele.", b:"CF, art. 109, § 3º; Lei 5.010/66, art. 15, III"},
    {t:"JEF: até 60 salários mínimos", x:"O Juizado Especial Federal julga causas de até 60 salários mínimos. Para medir, somam-se as parcelas atrasadas e 12 parcelas futuras.", b:"Lei 10.259/2001, art. 3º"},
    {t:"Sem custas e sem advogado obrigatório", x:"No primeiro grau não há custas, e a parte pode ir sem advogado. Para recorrer, o advogado é recomendado.", b:"Lei 10.259/2001, art. 10"},
    {t:"INSS sem prazo em dobro", x:"No JEF o INSS não tem prazo diferenciado, inclusive para recorrer.", b:"Lei 10.259/2001, art. 9º"},
    {t:"Pagamento por RPV", x:"Depois do trânsito em julgado, o valor de até 60 salários mínimos é pago por requisição de pequeno valor, em até 60 dias. Acima disso, precatório, salvo renúncia ao excedente.", b:"Lei 10.259/2001, art. 17"}
  ]},
  { id:"caminho", nome:"Caminho do processo", tipo:"linha", itens:[
    {t:"Pedido no INSS", x:"Pelo Meu INSS ou pelo 135. Guarde o número do protocolo.", r:"STF, Tema 350"},
    {t:"Decisão do INSS", x:"Negado, ou sem resposta em prazo razoável, abre-se o caminho da ação."},
    {t:"Petição inicial no JEF", x:"Com os documentos médicos, o CNIS e a carta de indeferimento. Valor da causa: atrasados mais 12 parcelas."},
    {t:"Perícia", x:"Médica (incapacidade, deficiência) e social (BPC). Oriente o cliente a levar todos os laudos e exames."},
    {t:"Audiência, se precisar", x:"Comum para provar atividade rural ou dependência econômica, com testemunhas."},
    {t:"Sentença", x:"Prazo de 10 dias para o recurso inominado.", r:"Lei 9.099/95, art. 42, aplicada ao JEF"},
    {t:"Turma Recursal", x:"Julga o recurso. Divergência de entendimento pode ir à Turma Regional ou à TNU.", r:"Lei 10.259/2001, art. 14"},
    {t:"RPV", x:"Depois do trânsito em julgado, pagamento em até 60 dias da requisição.", r:"Lei 10.259/2001, art. 17"}
  ]}
  ]},
{ id:"consumidor", titulo:"Direito do Consumidor", tema:"consumidor", cor:"--c-consumidor", resumo:"Light, Águas do Rio, internet, telefone e plataformas",
  secoes:[
  { id:"triagem", nome:"Qual o problema?", tipo:"triagem", inicio:"k1",
    nos:{
      k1:{p:"Qual é o problema do cliente?", ops:[
        ["Corte de luz, água ou internet","fCorte"],["TOI da Light (cobrança por irregularidade no medidor)","fTOI"],["Conta muito acima do normal","fFatura"],["Imóvel sem hidrômetro","fHidro"],["Desconto ou cobrança que ele não contratou","fDesc"],["Internet ou telefone que não funciona","fTel"],["Compra pela internet ou em plataforma","fPlat"]]}
    },
    fins:{
      fCorte:{t:"Corte de serviço", x:"O corte por falta de pagamento só é legal com aviso prévio, por conta atual, e sem começar na sexta, no sábado, no domingo, em feriado ou na véspera.",
        i:["Pergunte: recebeu aviso? Em que dia foi o corte? A conta estava paga? A dívida era antiga ou do mês?","Dívida antiga ou contestada não autoriza o corte: a empresa deve cobrar pelos meios comuns.","No TJRJ, o corte indevido de serviço essencial gera dano moral (Súmula 192).","Se ainda está sem o serviço, peça a religação com tutela de urgência (CPC, art. 300)."], b:"Lei 8.987/95, art. 6º, §§ 3º e 4º"},
      fTOI:{t:"TOI (Termo de Ocorrência e Inspeção)", x:"É o documento que a distribuidora faz quando alega irregularidade no medidor. Feito só por ela, não tem presunção de legitimidade no TJRJ, mesmo assinado pelo cliente.",
        i:["Pergunte: estava presente na inspeção? Recebeu cópia do TOI? Foi oferecida perícia no medidor?","Veja o período e o valor cobrados como recuperação de consumo.","Pelo STJ (Tema 699), o corte só cabe pelo consumo dos 90 dias anteriores à constatação, com direito de defesa, e até 90 dias depois do vencimento.","Peça a nulidade do TOI e da cobrança, que a empresa não corte nem negative, a devolução do que foi pago e dano moral se houve corte ou negativação."], b:"STJ, Tema 699; Resolução ANEEL 1.000/2021"},
      fFatura:{t:"Fatura alta", x:"Conta muito acima da média sem mudança no imóvel indica erro de leitura ou de medição. Cabe a inversão do ônus da prova: a empresa prova que o consumo é real.",
        i:["Junte as contas dos últimos 12 meses para mostrar a média.","Pergunte se houve mudança de moradores, aparelho novo ou vazamento (na água).","Peça à empresa a verificação do medidor e guarde o protocolo.","Na ação: revisão da conta pela média e devolução em dobro do que foi pago a mais."], b:"CDC, arts. 6º, VIII, e 42"},

function numeroCNJ(j, tr){
  const n = String(Math.floor(Math.random() * 9000000) + 1000000);
  const a = String(new Date().getFullYear());
  const o = String(Math.floor(Math.random() * 300) + 1).padStart(4, "0");
  const dd = 98n - (BigInt(n + a + j + tr + o + "00") % 97n);
  return n + "-" + String(dd).padStart(2, "0") + "." + a + "." + j + "." + tr + "." + o;
}
function hojeISO(d){ d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

function semente(txt){
  let h = 1779033703 ^ txt.length;
  for(let i = 0; i < txt.length; i++){ h = Math.imul(h ^ txt.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}

function batida(c, t, vol){
  const n = Math.floor(c.sampleRate * 0.09), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 5);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1100; f.Q.value = 2.5;
  const g = c.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
  const o = c.createOscillator(), g2 = c.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.16);
  g2.gain.setValueAtTime(vol * 0.9, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g2); g2.connect(c.destination); o.start(t); o.stop(t + 0.22);
}
function tom(c, t, freq, dur, vol, tipo){
  const o = c.createOscillator(), g = c.createGain();
  o.type = tipo || "sine"; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
}

/* ---------- o jogo ---------- */
function montar(c){
  const t = temaDaCarta(c);
  const ops = c.t === "vf"
    ? [{ txt:"Verdadeiro", certo:c.v === true, nota:c.v ? "" : c.n }, { txt:"Falso", certo:c.v === false, nota:c.v ? c.n : "" }]
    : embaralhar(c.o.map((txt, i) => ({ txt, certo:i === c.c, nota:(c.n && c.n[i]) || "" })));
  return { id:c.id, tema:t.id, sub:c.s, tipo:c.t, p:c.p, ops, por:c.por, base:c.b,
    num: t.j ? "Processo nº " + numeroCNJ(t.j, t.tr) : "Exame de Ordem · Questão " + String(1 + Math.floor(Math.random() * 80)).padStart(2, "0") };
}
function novoJogo(modo, pasta, jogadores){
  const M = MODOS[modo];
  let base;
  if(modo === "pauta") base = cartasDaPauta(hojeISO());
  else if(modo === "embargos") base = embaralhar(Object.keys(P.caderno).map(id => CARTA[id]).filter(Boolean)).slice(0, 15);
  else {
    base = embaralhar(pasta === "todas" ? CARTAS : TEMA[pasta].cartas);
    if(M.qtd) base = base.slice(0, M.qtd);
    else if(modo === "audiencia" && pasta === "todas") base = base.slice(0, 25);
  }
  if(!base.length){ aviso("Nada para revisar agora."); return; }
  pararTudo();
  S.jogo = { modo, pasta, fila:base.map(montar), i:0, pontos:0, seq:0, maxSeq:0, acertos:0, respostas:[], respondida:false, fim:false,
    vidas:M.vidas || 0, ajudas:M.ajudas ? { vista:1, vade:1, adiar:1 } : null, usouAjuda:false,
    tempoTotal:(M.tempo || 0) * 1000, tempoFim:0, contagem:modo === "plantao" ? 3 : 0,
    jogadores:jogadores ? jogadores.map(n => ({ nome:n, pontos:0, acertos:0 })) : null, vez:0, aguardando:modo === "duelo",
    novas:[], xpGanho:0, promocao:null, recorde:false, venceu:false };
  S.folha = null; S.aba = "jogar";
  render();
  if(modo === "plantao") contagemRegressiva();
}
function contagemRegressiva(){
  const J = S.jogo;
  som.tique();
  const passo = () => {
    if(S.jogo !== J) return;
    J.contagem--;
    if(J.contagem > 0){ som.tique(); render(false); agendar(passo, 750); }
    else { J.tempoFim = Date.now() + J.tempoTotal; som.martelo(); vibrar(20); render(false); iniciarRelogio(); }
  };
  agendar(passo, 750);
}
function relogioHTML(){
  const C = 2 * Math.PI * 26;
  return '<div class="relogio" id="relogio" role="timer" aria-label="Tempo restante"><svg viewBox="0 0 62 62" aria-hidden="true"><circle class="trilho" cx="31" cy="31" r="26"/><circle class="cheio" id="relogio-arco" cx="31" cy="31" r="26" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="0"/></svg><span id="relogio-num">60</span></div>';
}
function atualizarRelogio(){
  const J = S.jogo; if(!J || J.modo !== "plantao") return 0;
  const rest = J.tempoFim ? Math.max(0, J.tempoFim - Date.now()) : J.tempoTotal;
  const C = 2 * Math.PI * 26;
  const arco = document.getElementById("relogio-arco"), num = document.getElementById("relogio-num"), box = document.getElementById("relogio");
  if(arco) arco.setAttribute("stroke-dashoffset", (C * (1 - rest / J.tempoTotal)).toFixed(1));
  if(num) num.textContent = Math.ceil(rest / 1000);
  if(box) box.classList.toggle("urgente", rest <= 10000);
  return rest;
}
function iniciarRelogio(){
  if(relogio) clearInterval(relogio);
  relogio = setInterval(() => {
    const J = S.jogo;
    if(!J || J.modo !== "plantao" || J.fim){ clearInterval(relogio); relogio = null; return; }
    const rest = atualizarRelogio(), s = Math.ceil(rest / 1000);
    if(rest <= 5000 && s > 0 && s !== ultimoTique){ ultimoTique = s; som.tique(); }
    if(rest <= 0){ clearInterval(relogio); relogio = null; finalizar(); }
  }, 100);
}
function anguloAtual(){
  const J = S.jogo; let v = 0;
  if(J.modo === "audiencia"){ const erros = J.respostas.filter(r => r && !r.certo).length; v = (J.acertos - erros * 1.5) / 6; }
  if(J.modo === "duelo"){ const [a, b] = J.jogadores; v = (a.pontos - b.pontos) / 400; }
  v = Math.max(-1, Math.min(1, v));

}

function telaJogo(){
  const J = S.jogo;
  if(J.fim){ telaSentenca(); return; }
  const M = MODOS[J.modo], pasta = pastaDe(J.pasta), c = J.fila[J.i], t = TEMA[c.tema];
  const mult = multDe(J.seq);
  const sobre = J.modo === "pauta" ? dataCurta() : J.modo === "embargos" ? "Revisão" : J.modo === "duelo" ? "Carta " + (J.i + 1) + " de " + J.fila.length : pasta.curto;
  const hud = '<div class="hud"><button class="btn-texto" data-acao="sair" id="btn-sair" style="justify-self:start">Sair</button>' +
    '<div class="meio">' + esc(M.nome) + '<small>' + esc(sobre) + '</small></div>' +
    '<div class="pontos">' + (J.modo === "duelo" ? '' : '<span id="mult"' + (mult > 1 ? ' class="mult">×' + mult : '>') + '</span><b id="pts">' + fmt(J.pontos) + '</b>') + '</div></div>';
  let faixa;

/* arrastar a carta de verdadeiro ou falso */
function ligarArrasto(){
  const a = document.getElementById("arrasto"), sv = document.getElementById("sv"), sf = document.getElementById("sf");
  let x0 = 0, y0 = 0, dx = 0, ativo = false, decidido = false, id = null;
  const selos = p => { if(sv) sv.style.opacity = dx > 0 ? p : 0; if(sf) sf.style.opacity = dx < 0 ? p : 0; };
  a.addEventListener("pointerdown", e => {
    const J = S.jogo; if(!J || J.respondida || e.button > 0 || e.target.closest("button")) return;
    ativo = true; decidido = false; x0 = e.clientX; y0 = e.clientY; dx = 0; id = e.pointerId; a.classList.remove("solta");
  });
  a.addEventListener("pointermove", e => {
    if(!ativo || e.pointerId !== id) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if(!decidido){
      if(Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      decidido = true;
      if(Math.abs(mx) <= Math.abs(my)){ ativo = false; return; }
      try{ a.setPointerCapture(id); }catch(_){}
    }
    dx = mx;
    a.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 18) + "deg)";
    selos(Math.min(1, Math.abs(dx) / 110));
  });
  const soltar = e => {
    if(!ativo || e.pointerId !== id) return;
    ativo = false; selos(0);
    a.classList.add("solta"); a.style.transform = "";
    if(Math.abs(dx) > 100) responder(dx > 0 ? 0 : 1);
    dx = 0;
  };
  a.addEventListener("pointerup", soltar);
  a.addEventListener("pointercancel", soltar);
}

function responder(k){
  const J = S.jogo;
  if(!J || J.fim || J.respondida || J.aguardando || (J.modo === "plantao" && J.contagem > 0)) return;
  const c = J.fila[J.i], op = c.ops[k];
  if(!op || op.cortada) return;
  const certo = op.certo, idx = J.i;
  let ganho = 0, mult = 1;
  J.respondida = true;
  if(certo){ J.seq++; J.maxSeq = Math.max(J.maxSeq, J.seq); J.acertos++; } else J.seq = 0;
  if(J.modo === "duelo"){ const jog = J.jogadores[J.vez]; if(certo){ ganho = 100; jog.pontos += 100; jog.acertos++; } }
  else if(certo){ mult = multDe(J.seq); ganho = 100 * mult; J.pontos += ganho; }
  if(J.modo === "audiencia" && !certo) J.vidas = Math.max(0, J.vidas - 1);
  if(J.modo === "plantao" && !certo) J.tempoFim -= 5000;
  J.respostas[idx] = { escolha:k, certo, ganho, mult, vez:J.vez };
  if(J.modo !== "duelo") registrar(c, certo);

  const frente = document.getElementById("frente");
  frente.classList.add("respondida");
  frente.querySelectorAll('[data-acao="responder"]').forEach(b => {
    const i = Number(b.dataset.i); b.disabled = true;
    if(c.ops[i].certo) b.classList.add("correta");
    if(i === k){ b.classList.add("marcada"); if(!certo) b.classList.add("errada"); }
  });
  document.querySelectorAll(".ajuda").forEach(b => { b.disabled = true; });
  impacto(certo, ganho);
  atualizarHUD(certo, ganho);
  if(certo && J.modo !== "duelo") comemorar(J.seq);
  if(J.modo === "plantao"){ agendar(avancar, 720); return; }
  preencherVerso(c, k, certo, ganho, mult);
  document.getElementById("depois").innerHTML = '<button class="btn pri ver-explicacao" data-acao="virar">Ver a explicação</button>';
  agendar(() => { if(S.jogo === J && J.respondida && J.i === idx) virar(true); }, reduzido() ? 300 : 1150);
}
function impacto(certo, ganho){
  const J = S.jogo, lugar = document.getElementById("impacto"), carta = document.getElementById("carta");
  let extra = "";
  if(certo && ganho) extra = '<span class="flutua">+' + ganho + '</span>';
  else if(!certo && J.modo === "plantao") extra = '<span class="flutua nao">−5 s</span>';
  else if(!certo && J.modo === "audiencia") extra = '<span class="flutua nao">−1 recurso</span>';
  if(lugar) lugar.innerHTML = (reduzido() ? '' : MARTELO + '<span class="onda"></span>') +
    '<span class="carimbo bate ' + (certo ? "ok" : "nao") + '">' + (certo ? "Deferido" : "Indeferido") + '</span>' + extra;
  if(carta){ carta.classList.remove("entra", "impacto", "treme"); void carta.offsetWidth; carta.classList.add(certo ? "impacto" : "treme"); }
  if(certo){ som.certo(); vibrar(25); } else { som.errado(); vibrar([50, 40, 70]); }
}
function atualizarHUD(certo, ganho){
  const J = S.jogo;
  if(J.modo !== "duelo"){
    contar(document.getElementById("pts"), J.pontos - ganho, J.pontos);
    const m = document.getElementById("mult"), mm = multDe(J.seq);

  }
  const pl = document.querySelectorAll("#pontinhos li")[J.i]; if(pl) pl.className = certo ? "ok" : "nao";
  if(J.modo === "audiencia"){
    const vs = document.querySelectorAll("#vidas .vida"); if(!certo && vs[J.vidas]) vs[J.vidas].classList.add("perdida", "cai");
    const v = document.getElementById("vencidas"); if(v) v.textContent = J.acertos + " de " + J.fila.length + " vencidas";

}
function comemorar(seq){
  if(seq === 3) faixaCombo("Em sequência", "×2");
  if(seq === 5){ faixaCombo("Jurisprudência firmada", "×3"); papeis(18); som.combo(); ganhar("seq5"); }
  if(seq === 8) faixaCombo("Súmula à vista", "×3");
  if(seq === 10){ faixaCombo("Súmula vinculante", "×3"); papeis(26); ganhar("seq10"); }
  if(seq > 10 && seq % 5 === 0){ faixaCombo("Notório saber", seq + " seguidas"); papeis(22); }
}
function registrar(c, certo){
  const st = P.temas[c.tema] || (P.temas[c.tema] = { respondidas:0, acertos:0 });
  st.respondidas++;
  if(certo){
    st.acertos++;
    const nova = !P.acertadas[c.id];
    P.acertadas[c.id] = 1;
    if(P.caderno[c.id]) delete P.caderno[c.id];
    ganhar("primeiro");
    if(nova){
      if(TEMA[c.tema].cartas.every(x => P.acertadas[x.id])) ganhar("doutrina");
      if(CARTAS.every(x => P.acertadas[x.id])) ganhar("notorio");
    }
  } else P.caderno[c.id] = 1;
  salvar();
}
function ganhar(id){
  if(P.conquistas[id]) return;
  const i = CONQUISTAS.findIndex(c => c.id === id); if(i < 0) return;
  P.conquistas[id] = hojeISO(); salvar();
  if(S.jogo) S.jogo.novas.push(id);
  aviso("Conquista: <b>" + esc(CONQUISTAS[i].nome) + "</b>", ROMANOS[i]);
  som.combo();
}
const rotuloOp = (c, k) => c.tipo === "vf" ? c.ops[k].txt : LETRAS[k] + ") " + c.ops[k].txt;
const ehUltima = J => (J.modo === "audiencia" && J.vidas <= 0) || J.i >= J.fila.length - 1;

    '<div class="corpo">' +

        (certo && ganho ? '<span class="ganho">+' + ganho + (mult > 1 ? " (×" + mult + ")" : "") + '</span>' : '') + '</div>' +

      '<div class="bloco ok"><p class="rot">' + (certo ? "Sua resposta, a certa" : "Resposta certa") + '</p><p class="resp">' + esc(rotuloOp(c, ci)) + '</p></div>' +

    '</div><span class="marca-agua" aria-hidden="true">§</span>';

function virar(paraVerso){
  const carta = document.getElementById("carta"), frente = document.getElementById("frente"), verso = document.getElementById("verso");
  if(!carta || !verso || !verso.innerHTML) return;
  carta.classList.remove("entra", "treme", "impacto");
  carta.classList.toggle("virada", paraVerso);
  frente.inert = paraVerso; frente.setAttribute("aria-hidden", paraVerso ? "true" : "false");
  verso.inert = !paraVerso; verso.setAttribute("aria-hidden", paraVerso ? "false" : "true");
  const alvo = paraVerso ? document.getElementById("veredito") : frente.querySelector(".ver-explicacao");
  if(alvo) setTimeout(() => alvo.focus({ preventScroll:true }), reduzido() ? 0 : 380);
  const mesa = document.querySelector(".mesa");
  if(mesa && mesa.getBoundingClientRect().top < 60) window.scrollTo({ top:Math.max(0, window.scrollY + mesa.getBoundingClientRect().top - 90), behavior:reduzido() ? "auto" : "smooth" });
}
function sair(dir, depois){
  const a = document.getElementById("arrasto");
  if(!a || reduzido()){ depois(); return; }
  a.classList.remove("solta"); a.style.transform = ""; a.classList.add("sai-" + dir);
  agendar(depois, 300);
}
function proxima(){
  const J = S.jogo; if(!J || !J.respondida || J.fim) return;
  if(ehUltima(J)){ finalizar(); return; }
  const r = J.respostas[J.i];
  sair(r && r.certo ? "dir" : "esq", () => {
    J.i++; J.respondida = false;
    if(J.modo === "duelo"){ J.vez = J.i % 2; J.aguardando = true; }
    render(false);
  });
}
function avancar(){
  const J = S.jogo; if(!J || J.fim) return;
  if(J.tempoFim && Date.now() >= J.tempoFim){ finalizar(); return; }
  if(J.i >= J.fila.length - 2) J.fila.push(...embaralhar(J.pasta === "todas" ? CARTAS : TEMA[J.pasta].cartas).map(montar));
  const r = J.respostas[J.i];
  sair(r && r.certo ? "dir" : "esq", () => { if(J.fim) return; J.i++; J.respondida = false; render(false); });
}
function finalizar(){
  const J = S.jogo; if(!J || J.fim) return;
  pararTudo();
  J.fim = true;
  const hoje = hojeISO();
  const respondidas = J.respostas.filter(Boolean).length;
  if(J.modo === "duelo") ganhar("duelo");
  else {
    let contaXP = true;
    if(J.modo === "pauta"){
      if(P.pauta.data !== hoje){
        const seq = P.pauta.ultima === ontemISO() ? P.pauta.seq + 1 : 1;
        P.pauta = { data:hoje, pontos:J.pontos, acertos:J.acertos, resultado:J.fila.map((_, k) => J.respostas[k] && J.respostas[k].certo ? 1 : 0), seq, melhorSeq:Math.max(P.pauta.melhorSeq || 0, seq), ultima:hoje };
        J.pautaContou = true;
        ganhar("pauta"); if(seq >= 3) ganhar("pauta3");
      } else contaXP = false;
    }
    if(contaXP){
      J.xpGanho = J.pontos;
      const antes = nivelDe(P.xp); P.xp += J.xpGanho; const depois = nivelDe(P.xp);
      J.promocao = depois > antes ? depois : null;
    }
    if(J.modo !== "pauta" && J.modo !== "embargos"){
      const chave = J.modo + ":" + J.pasta, ant = P.recordes[chave] || 0;
      J.recorde = ant > 0 && J.pontos > ant;
      P.recordes[chave] = Math.max(ant, J.pontos);
    }
    if(J.modo === "treino" && J.acertos === J.fila.length && J.fila.length >= 10 && !J.usouAjuda) ganhar("semajuda");
    if(J.modo === "audiencia"){ J.venceu = J.vidas > 0 && respondidas >= J.fila.length; if(J.venceu && J.vidas === 3) ganhar("semrecurso"); }
    if(J.modo === "plantao" && J.acertos >= 10) ganhar("plantao10");
    if(J.modo === "embargos" && J.acertos > 0 && !Object.keys(P.caderno).length) ganhar("embargos");
  }
  salvar();
  render();
  som.fim(); vibrar([30, 60, 30, 60, 60]);
  const bom = J.modo === "duelo" || J.venceu || (respondidas && J.acertos / respondidas >= .8) || (J.modo === "plantao" && J.acertos >= 10);
  if(bom) setTimeout(() => papeis(30), 350);
}

function telaSentenca(){
  const J = S.jogo, M = MODOS[J.modo], pasta = pastaDe(J.pasta);
  const idx = J.fila.map((_, k) => k).filter(k => J.respostas[k]);
  const total = idx.length, ac = J.acertos, pct = total ? ac / total : 0;
  let relato, decisao, carimbo, cls;
  if(J.modo === "duelo"){
    const [a, b] = J.jogadores;
    relato = "Trata-se de duelo de " + J.fila.length + " cartas de " + pasta.nome + ", entre " + a.nome + " e " + b.nome + ".";
    if(a.acertos === b.acertos){ decisao = "Ante o empate de " + a.acertos + " a " + b.acertos + ", homologo o acordo entre as partes."; carimbo = "Acordo homologado"; cls = "meio"; }
    else { const v = a.acertos > b.acertos ? a : b, p = v === a ? b : a; decisao = "Ante o exposto, julgo procedente o pedido de " + v.nome + ", que venceu " + p.nome + " por " + v.acertos + " a " + p.acertos + "."; carimbo = "Procedente"; cls = "ok"; }
  } else if(J.modo === "audiencia"){
    relato = "Trata-se de audiência com cartas de " + pasta.nome + ". A parte respondeu " + total + " e acertou " + ac + ".";
    if(J.venceu){ decisao = "Ante o exposto, julgo procedente o pedido. A parte venceu a audiência com " + plural(J.vidas, "recurso", "recursos") + " sobrando."; carimbo = "Procedente"; cls = "ok"; }
    else { decisao = "Esgotados os recursos, a decisão transitou em julgado depois de " + plural(ac, "carta vencida", "cartas vencidas") + "."; carimbo = "Trânsito em julgado"; cls = "nao"; }
  } else if(J.modo === "plantao"){
    relato = "Trata-se de plantão de 60 segundos com cartas de " + pasta.nome + ".";
    decisao = "Encerrado o prazo, a parte acertou " + ac + " de " + total + " cartas, com sequência máxima de " + J.maxSeq + ".";
    carimbo = ac >= 10 ? "Protocolado" : "Prazo encerrado"; cls = ac >= 10 ? "ok" : "meio";
  } else {
    relato = J.modo === "pauta" ? "Trata-se da pauta de " + dataCurta() + ", com uma carta de cada pasta."
      : J.modo === "embargos" ? "Trata-se de embargos sobre " + plural(total, "carta", "cartas") + " que a parte havia errado."
      : "Trata-se de treino de " + total + " cartas de " + pasta.nome + ".";
    if(pct >= .8){ decisao = "Ante o exposto, julgo procedente o pedido. A parte está pronta para a audiência."; carimbo = "Procedente"; cls = "ok"; }
    else if(pct >= .5){ decisao = "Julgo parcialmente procedente o pedido. Revise as cartas que ficaram para trás e jogue de novo."; carimbo = "Parcialmente procedente"; cls = "meio"; }
    else { decisao = "Julgo improcedente o pedido. Cabe recurso: leia o guia e jogue de novo."; carimbo = "Improcedente"; cls = "nao"; }
  }
  const numeros = J.modo === "duelo"
    ? '<div><b>' + J.jogadores[0].acertos + '</b><span>' + esc(J.jogadores[0].nome) + '</span></div><div><b>' + J.jogadores[1].acertos + '</b><span>' + esc(J.jogadores[1].nome) + '</span></div><div><b>' + J.fila.length + '</b><span>cartas</span></div>'
    : '<div><b>' + ac + '/' + total + '</b><span>acertos</span></div><div><b>' + fmt(J.pontos) + '</b><span>pontos</span></div><div><b>' + J.maxSeq + '</b><span>maior sequência</span></div>';
  const guiaId = (J.pasta !== "todas" && GUIA[J.pasta]) ? J.pasta : null;
  const podeRepetir = J.modo !== "embargos" || Object.keys(P.caderno).length > 0;
  tela.innerHTML = '<section class="sentenca">' +
    '<div class="folha-sentenca">' +
      '<p class="pri-linha">Em Juízo · ' + esc(M.nome) + (J.modo === "pauta" || J.modo === "embargos" ? "" : " · " + esc(pasta.nome)) + ' · ' + new Date().toLocaleDateString("pt-BR") + '</p>' +
      '<h1>Sentença</h1>' +
      '<p class="vistos">Vistos etc.</p>' +
      '<p>' + esc(relato) + '</p>' +
      '<p class="dispositivo">' + esc(decisao) + '</p>' +
      '<div class="carimbo-lugar"><span class="carimbo bate ' + cls + '">' + carimbo + '</span></div>' +
      '<div class="numeros">' + numeros + '</div>' +
      '<div class="quadrinhos" aria-hidden="true">' + idx.map(k => '<i class="' + (J.respostas[k].certo ? "" : "nao") + '"></i>').join("") + '</div>' +
      (J.recorde ? '<p class="dispositivo" style="color:var(--certo-papel)">Novo recorde neste modo.</p>' : '') +
      (J.xpGanho ? '<p class="vistos">A parte ganhou ' + fmt(J.xpGanho) + ' XP de carreira.</p>' : (J.modo === "pauta" && !J.pautaContou ? '<p class="vistos">A pauta de hoje já tinha sido cumprida: esta rodada não conta pontos.</p>' : '')) +
      '<p class="vistos">Publique-se. Registre-se. Intime-se.</p>' +
    '</div>' +
    (J.promocao !== null && J.promocao !== undefined ? '<div class="promocao"><small>Promoção</small><b>' + esc(NIVEIS[J.promocao].nome) + '</b><span>Nível ' + (J.promocao + 1) + ' da carreira.</span></div>' : '') +
    (J.novas.length ? '<div class="novas">' + J.novas.map(id => { const i = CONQUISTAS.findIndex(c => c.id === id); return '<div class="nova"><span class="disco">' + ROMANOS[i] + '</span><span><b>' + esc(CONQUISTAS[i].nome) + '</b><span>' + esc(CONQUISTAS[i].como) + '</span></span></div>'; }).join("") + '</div>' : '') +
    '<div class="acoes-fim">' +
      (podeRepetir ? '<button class="btn pri" data-acao="de-novo">' + (J.modo === "duelo" ? "Revanche" : J.modo === "embargos" ? "Revisar de novo" : "Jogar de novo") + '</button>' : '<button class="btn pri" data-acao="inicio">Caderno zerado. Voltar ao início</button>') +
      '<button class="btn sec" data-acao="copiar"' + (guiaId ? '' : ' style="grid-column:1/-1"') + '>Copiar resultado</button>' +
      (guiaId ? '<button class="btn sec" data-acao="abrir-guia" data-id="' + guiaId + '">Abrir o guia</button>' : '') +
      (podeRepetir ? '<button class="btn-texto" data-acao="inicio" style="grid-column:1/-1;justify-self:center">Voltar ao início</button>' : '') +
    '</div>' +
    '<div id="copia"></div>' +
    '<p class="rotulo">Revise as cartas</p>' +
    '<ol class="revisao">' + idx.map(k => {
      const c = J.fila[k], r = J.respostas[k], ci = c.ops.findIndex(o => o.certo);
      return '<li><details' + (r.certo ? '' : ' open') + '><summary><span class="marca-res ' + (r.certo ? 'ok">Acertou' : 'nao">Errou') + '</span><span>' + esc(c.p) + '</span></summary>' +
        '<div class="det">' + (r.certo ? '' : '<p><b>Marcou:</b> ' + esc(c.ops[r.escolha] ? c.ops[r.escolha].txt : "") + '</p>') +
        '<p><b>Certa:</b> ' + esc(c.ops[ci].txt) + '</p><p>' + esc(c.por) + '</p><p class="base-lei">' + esc(c.base) + '</p></div></details></li>';
    }).join("") + '</ol>' +
  '</section>';
}
function textoResultado(){
  const J = S.jogo, M = MODOS[J.modo], pasta = pastaDe(J.pasta);
  const idx = J.fila.map((_, k) => k).filter(k => J.respostas[k]);
  const q = idx.map(k => J.respostas[k].certo ? "🟩" : "🟥").join("");
  const linha = J.modo === "duelo"
    ? J.jogadores[0].nome + " " + J.jogadores[0].acertos + " × " + J.jogadores[1].acertos + " " + J.jogadores[1].nome
    : J.acertos + "/" + idx.length + " · " + fmt(J.pontos) + " pts · sequência de " + J.maxSeq;
  return "Em Juízo ⚖️ " + M.nome + (J.modo === "pauta" ? " de " + dataCurta() : J.modo === "embargos" ? "" : " · " + pasta.nome) + "\n" + q + "\n" + linha;
}
function copiar(){
  const txt = textoResultado();
  const mostrar = () => { const box = document.getElementById("copia"); if(!box) return; box.innerHTML = '<textarea class="copiar-area" readonly aria-label="Resultado para copiar">' + esc(txt) + '</textarea>'; const ta = box.querySelector("textarea"); ta.focus(); ta.select(); aviso("Selecione o texto e copie."); };
  try{
    navigator.clipboard.writeText(txt).then(() => aviso("Resultado copiado. Cole no WhatsApp."), mostrar);
  }catch(_){ mostrar(); }
}

/* ---------- carreira ---------- */
function telaCarreira(){
  const n = infoNivel(P.xp), feitas = CONQUISTAS.filter(c => P.conquistas[c.id]).length;
  tela.innerHTML =
    '<section class="topo-secao"><p class="sobre">Carreira</p><h1 class="titulo">Do estágio ao Supremo.</h1></section>' +
    '<div class="cracha-grande" style="margin-top:14px">' +
      '<div class="cracha-topo"><span class="avatar">' + esc(iniciais(P.nome)) + '</span><div style="min-width:0"><h1>' + (P.nome ? esc(P.nome) : "Sem nome no crachá") + '</h1>' +
      '<p class="cargo">Nível ' + (n.k + 1) + ' · <b>' + esc(n.atual.nome) + '</b></p></div></div>' +
      '<div class="xp-linha">' + anel(n.p, Math.round(n.p * 100) + "%") + '<p><b>' + fmt(P.xp) + '</b> XP de carreira<br>' +
        (n.prox ? "Faltam " + fmt(n.prox.xp - P.xp) + " XP para " + esc(n.prox.nome) + "." : "Você chegou ao topo da carreira.") + '</p></div>' +
      '<button class="btn sec" data-acao="nome" style="justify-self:start">' + (P.nome ? "Editar o nome" : "Pôr meu nome") + '</button>' +
    '</div>' +
    '<p class="rotulo">A escada</p><ol class="escada">' + NIVEIS.map((v, i) =>
      '<li class="degrau ' + (i < n.k ? "feito" : i === n.k ? "atual" : "futuro") + '"><span class="marco">' + (i < n.k ? "✓" : i + 1) + '</span><b>' + esc(v.nome) + '</b><span class="miudo">' + fmt(v.xp) + ' XP</span></li>').join("") + '</ol>' +
    '<p class="rotulo">Conquistas · ' + feitas + ' de ' + CONQUISTAS.length + '</p><div class="selos">' + CONQUISTAS.map((c, i) =>
      '<div class="selo' + (P.conquistas[c.id] ? "" : " travado") + '"><span class="disco">' + ROMANOS[i] + '</span><b>' + esc(c.nome) + '</b><small>' + esc(c.como) + '</small></div>').join("") + '</div>' +
    '<p class="rotulo">Pastas</p><div class="tabela"><div class="lin cab"><span>Pasta</span><span class="val">Domínio</span><span class="val">Acerto</span><span class="val">Recorde</span></div>' +
      TEMAS.map(t => { const st = P.temas[t.id] || {}; return '<div class="lin" style="--cor:var(' + t.cor + ')"><span class="nome"><i></i>' + esc(t.curto) + '</span><span class="val">' + dominio(t) + '/' + t.cartas.length + '</span><span class="val">' + (st.respondidas ? Math.round(100 * st.acertos / st.respondidas) : 0) + '%</span><span class="val">' + fmt(P.recordes["treino:" + t.id] || 0) + '</span></div>'; }).join("") + '</div>' +
    '<p class="rotulo">Pauta do dia</p><div class="tabela">' +
      '<div class="lin"><span class="nome">Sequência atual</span><span></span><span></span><span class="val">' + seqAtual() + '</span></div>' +
      '<div class="lin"><span class="nome">Melhor sequência</span><span></span><span></span><span class="val">' + (P.pauta.melhorSeq || 0) + '</span></div></div>' +
    '<button class="btn sec" data-acao="zerar" id="btn-zerar" style="margin-top:24px">Zerar a carreira</button>';
}

/* ---------- guia ---------- */
function telaGuias(){
  tela.innerHTML =
    '<section class="topo-secao"><p class="sobre">Guia de atendimento</p><h1 class="titulo">O que perguntar ao cliente.</h1>' +
      '<p class="lead">Um guia por tema: a triagem do caso, as perguntas, o essencial da lei e os documentos.</p></section>' +
    '<div class="guias">' + GUIAS.map(g =>
      '<button class="guia-item" style="--cor:var(' + g.cor + ')" data-acao="abrir-guia" data-id="' + g.id + '"><span class="letra-g">' + esc(g.titulo.replace(/^(Direito do |Direito |Exame da )/, "").charAt(0)) + '</span>' +
      '<span style="min-width:0"><b>' + esc(g.titulo) + '</b><small>' + esc(g.resumo) + '</small></span><span class="miudo">' + plural(g.secoes.length, "parte", "partes") + '</span></button>').join("") + '</div>';
}
function telaGuia(){
  const g = GUIA[S.guia];
  if(!g){ S.guia = null; telaGuias(); return; }
  const sec = g.secoes.find(s => s.id === S.secao) || g.secoes[0];
  S.secao = sec.id;
  const t = TEMA[g.tema];
  tela.innerHTML = '<section style="--cor:var(' + g.cor + ')">' +
    '<div class="topo-secao"><button class="btn-texto" data-acao="voltar-guias" style="justify-self:start">Voltar aos guias</button><p class="sobre">Guia</p><h1 class="titulo">' + esc(g.titulo) + '</h1></div>' +
    '<div class="segmentos" role="group" aria-label="Partes do guia">' + g.secoes.map(s => '<button class="seg" data-acao="secao" data-id="' + s.id + '" aria-pressed="' + (s.id === sec.id) + '">' + esc(s.nome) + '</button>').join("") + '</div>' +
    '<div id="secao">' + secaoHTML(g, sec) + '</div>' +
    (t ? '<div class="treinar"><span class="miudo">Treine com as cartas de ' + esc(t.nome) + '.</span><button class="btn pri" data-acao="jogar" data-modo="treino" data-pasta="' + t.id + '">Jogar este tema</button></div>' : '') +
  '</section>';
}
function secaoHTML(g, s){
  const chave = g.id + ":" + s.id + ":";
  if(s.tipo === "triagem") return triagemHTML(s);
  if(s.tipo === "perguntas" || s.tipo === "lista") return '<div class="perguntas">' + s.itens.map((it, k) => {
      const txt = typeof it === "string" ? it : it.p, sub = typeof it === "string" ? "" : it.x;
      return '<label class="pq"><input type="checkbox" data-marca="' + chave + k + '"' + (P.marcas[chave + k] ? ' checked' : '') + '><span><b>' + esc(txt) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span></label>';
    }).join("") + '</div><button class="btn sec" style="margin-top:12px" data-acao="limpar" data-chave="' + chave + '">Limpar marcações</button>';
  if(s.tipo === "cards") return '<div class="notas">' + s.itens.map(it =>
      '<article class="nota-card"><h3>' + esc(it.t) + '</h3><p>' + esc(it.x) + '</p>' + (it.b ? '<p class="base-lei">' + esc(it.b) + '</p>' : '') + '</article>').join("") + '</div>';
  if(s.tipo === "linha") return '<ol class="linha">' + s.itens.map((it, k) =>
      '<li><span class="passo">' + (k + 1) + '</span><div><h3>' + esc(it.t) + '</h3><p>' + esc(it.x) + '</p>' + (it.r ? '<p class="ref">' + esc(it.r) + '</p>' : '') + '</div></li>').join("") + '</ol>';
  if(s.tipo === "prazos") return '<div class="prazos">' + s.itens.map(it =>
      '<div class="prazo"><b>' + esc(it.n) + '</b><span>' + esc(it.t) + '</span><small>Lei 9.099/95, ' + esc(it.r) + '</small></div>').join("") + '</div>';
  return "";
}
function triagemHTML(s){
  let atual = s.inicio;
  const caminho = S.triagem.map((passo, k) => {
    const no = s.nos[passo.no], resp = no.ops[passo.op][0];
    atual = no.ops[passo.op][1];
    return '<li><span class="n">' + (k + 1) + '.</span><span>' + esc(no.p) + ' <b>' + esc(resp) + '</b></span></li>';
  }).join("");
  const voltar = S.triagem.length ? '<div class="linha-acoes" style="margin-top:12px"><button class="btn sec" data-acao="triagem-voltar">Voltar uma pergunta</button><button class="btn sec" data-acao="triagem-recomeca">Recomeçar</button></div>' : '';
  const lista = caminho ? '<ol class="caminho">' + caminho + '</ol>' : '';
  if(s.fins[atual]){
    const f = s.fins[atual];
    return lista + '<div class="cartao resultado"><p class="eti">Caminho provável</p><h3>' + esc(f.t) + '</h3><p class="lead">' + esc(f.x) + '</p>' +
      (f.i && f.i.length ? '<ul class="itens">' + f.i.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' : '') +
      '<p class="base-lei">' + esc(f.b) + '</p></div>' + voltar;
  }
  const no = s.nos[atual];
  return lista + '<div class="cartao"><p class="triagem-p">' + esc(no.p) + '</p><div class="triagem-ops">' +
    no.ops.map((o, k) => '<button class="triagem-op" data-acao="triar" data-no="' + atual + '" data-op="' + k + '">' + esc(o[0]) + '</button>').join("") +
    '</div></div>' + voltar;
}
function rerenderSecao(){
  const g = GUIA[S.guia], s = g && g.secoes.find(x => x.id === S.secao), alvo = document.getElementById("secao");
  if(g && s && alvo){ alvo.innerHTML = secaoHTML(g, s); document.querySelectorAll(".seg").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === s.id))); }
  else render(false);
}

/* ===================== AÇÕES ===================== */
function brincarBalanca(el){
  const svg = el.querySelector(".balanca"); if(!svg) return;
  svg.classList.remove("oscila");
  svg.style.setProperty("--ang", ((Math.random() < .5 ? -1 : 1) * (11 + Math.random() * 7)).toFixed(1) + "deg");
  som.martelo(); vibrar(12);
  clearTimeout(el._volta);
  el._volta = setTimeout(() => { svg.style.removeProperty("--ang"); svg.classList.add("oscila"); }, 1500);
}
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-acao]");
  if(!el) return;
  const acao = el.dataset.acao;
  if(acao === "fechar-fundo"){ if(ev.target === el) fecharFolha(); return; }
  switch(acao){
    case "tema": alternarTema(); break;
    case "som": P.som = !P.som; salvar(); rotuloSom(); som.toque(); break;
    case "aba":
      if(S.jogo && !S.jogo.fim){ const b = document.getElementById("btn-sair"); if(b) b.click(); break; }
      pararTudo(); S.jogo = null; S.aba = el.dataset.aba; S.guia = null; render(); break;
    case "ir-carreira": S.aba = "carreira"; render(); break;
    case "inicio": pararTudo(); S.jogo = null; S.aba = "jogar"; render(); break;
    case "modo": S.folha = { tipo:"pasta", modo:el.dataset.modo }; renderFolha(); som.toque(); break;
    case "fechar": fecharFolha(); break;
    case "jogar": novoJogo(el.dataset.modo || "treino", el.dataset.pasta || "todas"); break;
    case "duelo-pasta": S.folha = { tipo:"duelo", pasta:el.dataset.pasta }; renderFolha(); break;
    case "duelo-comecar": comecarDuelo(); break;
    case "nome": S.folha = { tipo:"nome" }; renderFolha(); break;
    case "nome-salvar": salvarNome(); break;
    case "abrir-guia": pararTudo(); S.jogo = null; S.aba = "guia"; S.guia = el.dataset.id; S.secao = null; S.triagem = []; render(); break;
    case "voltar-guias": S.guia = null; render(); break;
    case "secao": S.secao = el.dataset.id; S.triagem = []; rerenderSecao(); break;
    case "triar": S.triagem.push({ no:el.dataset.no, op:Number(el.dataset.op) }); rerenderSecao(); break;
    case "triagem-voltar": S.triagem.pop(); rerenderSecao(); break;
    case "triagem-recomeca": S.triagem = []; rerenderSecao(); break;
    case "limpar": Object.keys(P.marcas).forEach(k => { if(k.indexOf(el.dataset.chave) === 0) delete P.marcas[k]; }); salvar(); rerenderSecao(); break;
    case "responder": responder(Number(el.dataset.i)); break;
    case "ajuda": usarAjuda(el.dataset.tipo); break;
    case "virar": virar(true); break;
    case "desvirar": virar(false); break;
    case "proxima": proxima(); break;
    case "mostrar-carta": if(S.jogo){ S.jogo.aguardando = false; som.toque(); render(false); } break;
    case "de-novo": { const J = S.jogo; if(J) novoJogo(J.modo, J.pasta, J.jogadores ? J.jogadores.map(j => j.nome) : null); break; }
    case "copiar": copiar(); break;
    case "balanca": brincarBalanca(el); break;
    case "sair":
      if(sairArmado){ clearTimeout(sairArmado); sairArmado = null; pararTudo(); S.jogo = null; S.aba = "jogar"; render(); }
      else { el.textContent = "Toque de novo para sair"; el.classList.add("armado"); sairArmado = setTimeout(() => { sairArmado = null; const b = document.getElementById("btn-sair"); if(b){ b.textContent = "Sair"; b.classList.remove("armado"); } }, 3000); }
      break;
    case "zerar":
      if(zerarArmado){
        clearTimeout(zerarArmado); zerarArmado = null;
        Object.assign(P, { xp:0, conquistas:{}, acertadas:{}, caderno:{}, recordes:{}, temas:{}, pauta:pautaVazia() });
        salvar(); render(false); aviso("Carreira zerada.");
      } else { el.textContent = "Toque de novo para zerar tudo"; zerarArmado = setTimeout(() => { zerarArmado = null; const b = document.getElementById("btn-zerar"); if(b) b.textContent = "Zerar a carreira"; }, 3000); }
      break;
  }
});
document.addEventListener("change", ev => {
  const cx = ev.target.closest("input[data-marca]"); if(!cx) return;
  if(cx.checked) P.marcas[cx.dataset.marca] = 1; else delete P.marcas[cx.dataset.marca];
  salvar();
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  if(ev.target.id === "form-nome") salvarNome();
  if(ev.target.id === "form-duelo") comecarDuelo();
});
document.addEventListener("keydown", ev => {
  if(ev.key === "Escape" && S.folha){ fecharFolha(); return; }
  const J = S.jogo;
  if(!J || J.fim || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if(ev.target && ev.target.tagName === "INPUT") return;
  const tecla = (ev.key || "").toUpperCase();
  if(J.aguardando){ if(ev.key === "Enter"){ ev.preventDefault(); J.aguardando = false; render(false); } return; }
  if(!J.respondida){
    const c = J.fila[J.i]; let k = -1;
    if(/^[1-4]$/.test(tecla)) k = Number(tecla) - 1;
    else if(c.tipo === "vf"){ if(tecla === "V" || ev.key === "ArrowRight") k = 0; else if(tecla === "F" || ev.key === "ArrowLeft") k = 1; }
    else if(tecla.length === 1 && "ABCD".indexOf(tecla) >= 0) k = "ABCD".indexOf(tecla);
    if(k >= 0 && k < c.ops.length){ ev.preventDefault(); responder(k); }
  } else if(ev.key === "Enter" && J.modo !== "plantao" && !(ev.target.closest && ev.target.closest("button"))){ ev.preventDefault(); proxima(); }
});

/* ===================== COMEÇO ===================== */
rotuloTema(); rotuloSom();
const hot = window.claude && window.claude.hot;
if(hot && hot.snapshot) hot.snapshot(() => ({ aba:S.aba, guia:S.guia, secao:S.secao, triagem:S.triagem, jogo:(S.jogo && S.jogo.modo !== "plantao") ? S.jogo : null }));
function start(d){
  if(d && d.aba){ S.aba = d.aba; S.guia = d.guia || null; S.secao = d.secao || null; S.triagem = d.triagem || []; }
  if(d && d.jogo && Array.isArray(d.jogo.fila)){
    S.jogo = d.jogo;
    if(S.jogo.respondida && !S.jogo.fim){
      if(ehUltima(S.jogo)){ render(); finalizar(); return; }
      S.jogo.i++; S.jogo.respondida = false;
      if(S.jogo.modo === "duelo"){ S.jogo.vez = S.jogo.i % 2; S.jogo.aguardando = true; }
    }
  }
  render();
}
if(hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
